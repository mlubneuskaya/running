# DVC pipeline — YOLO fine-tuning + pose extraction + gait event detection
#
# Three logical pipelines in dependency order:
#   yolo_hp_tune → yolo_finetune → pose_extract → gait stages → notebooks
#
# Manually-produced inputs tracked with `dvc add` (not generated by pipeline):
#   data/input/optojump/                                          (raw recordings)
#   data/output/annotations/optojump/ml_training_dataset.csv     (manual labels)
#   data/models/yolo/yolo26l-pose/                            (base YOLO weights)

stages:

  # ── YOLO hyperparameter search (Ray Tune) ────────────────────────────────────
  yolo_hp_tune:
    cmd: >
      python scripts/yolo_finetuning/tune_hyperparameters_yolo.py
      --config configs/pose/ray_tune.yaml
    deps:
      - scripts/yolo_finetuning/tune_hyperparameters_yolo.py
      - configs/pose/ray_tune.yaml
      - data/models/yolo/yolo26l-pose.pt
    params:
      - configs/pose/ray_tune.yaml:
          - tune_args.iterations
          - space

  yolo_finetune:
    cmd: python scripts/yolo_finetuning/finetune_yolo.py --config configs/pose/yolo_full_training.yaml
    deps:
      - scripts/yolo_finetuning/finetune_yolo.py
      - scripts/yolo_finetuning/recover_tuning_results.py
      - configs/pose/yolo_full_training.yaml
      - data/models/yolo/yolo26l-pose.pt
    params:
      - configs/pose/yolo_full_training.yaml:
          - ray_tune.top_n
          - ray_tune.metric
          - training.epochs
          - training.patience

    outs:
      - data/models/yolo/tuned/yolo26l_full_d725f_000332/
      - data/models/yolo/tuned/yolo26l_full_d725f_000342/
      - data/models/yolo/tuned/yolo26l_tune_d725f_000412/
      - data/models/yolo/tuned/yolo26l_tune_d725f_000442/


  pose_extract_yolo_comparison:
    cmd: >
      for cfg in configs/ray_runs/config_yolo_*.yaml; do
        python scripts/run_pose_detection.py --config "$cfg";
      done
    deps:
      - scripts/run_pose_detection.py
      - src/pose/processors/yolo.py
      - src/pose/utils/detection/filtering.py
      - src/pose/utils/file_discovery.py
      - src/pose/utils/get_path.py
      - configs/ray_runs/
      - data/input/video/high_fps/
      - data/input/optojump/
      - data/models/yolo/tuned/
    outs:
      - data/output/pose/tuned_yolo/

  pose_extract_mediapipe:
    cmd: python scripts/run_pose_detection.py --config configs/config_mediapipe.yaml
    deps:
      - scripts/run_pose_detection.py
      - src/pose/processors/mediapipe.py
      - src/pose/utils/file_discovery.py
      - src/pose/utils/get_path.py
      - configs/config_mediapipe.yaml
      - data/input/video/high_fps/
      - data/models/mediapipe/pose/pose_landmarker_heavy.task
      - data/models/yolo/yolo26l.pt
    outs:
      - data/output/pose/mediapipe/yolo_detector/

  nb_yolo_comparison:
    cmd: >
      papermill notebooks/ray_tune_model_comparison.ipynb
      data/output/pose/notebooks/ray_tune_model_comparison.ipynb
      -k python3
    deps:
      - notebooks/ray_tune_model_comparison.ipynb
      - data/output/pose/tuned_yolo/
      - data/output/pose/mediapipe/yolo_detector/
    outs:
      - data/output/pose/notebooks/ray_tune_model_comparison.ipynb:
          cache: false

  # ════════════════════════════════════════════════════════════════════════════
  # GAIT PIPELINE  (depends on pose_extract output)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Stage 1 — kinematic baseline + XGBoost feature ablation ─────────────────
  stage1_baselines:
    cmd: python -m experiments.gait_detection.pose_data.baselines --config configs/experiments/pose_data/baselines.yaml
    deps:
      - experiments/gait_detection/pose_data/baselines.py
      - src/gait/detection/detectors.py
      - src/gait/detection/features.py
      - src/gait/gait_data/dataset.py
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/baselines.yaml:
          - experiment.fps
          - experiment.n_val_athletes_tuning
          - experiment.random_seed
    metrics:
      - data/output/gait/pose_data/stage1/results.json

  # ── Stage 2 — TCN hyperparameter search (Optuna) ─────────────────────────────
  stage2_tcn_tune:
    cmd: python -m experiments.gait_detection.pose_data.tcn_tuning --config configs/experiments/pose_data/tcn_tuning.yaml
    deps:
      - experiments/gait_detection/pose_data/tcn_tuning.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - src/gait/gait_data/dataset.py
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/tcn_tuning.yaml:
          - experiment.random_seed
          - optuna.n_trials
          - experiment.feature_idx
          - search_space
    outs:
      - data/output/gait/pose_data/stage2/best_params.json
      - data/output/gait/pose_data/stage2/study.log

  # ── Stage 3 — XGBoost hyperparameter tuning (independent of TCN) ─────────────
  stage3_xgb_tune:
    cmd: python -m experiments.gait_detection.pose_data.xgb_tuning --config configs/experiments/pose_data/xgb_tuning.yaml
    deps:
      - experiments/gait_detection/pose_data/xgb_tuning.py
      - src/gait/detection/features.py
      - src/gait/gait_data/dataset.py
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/xgb_tuning.yaml:
          - optuna.n_trials
          - experiment.feature_idx
    outs:
      - data/output/gait/pose_data/stage3/best_params.json
      - data/output/gait/pose_data/stage3/checkpoints/model.pkl

  # ── Stage 4 — leave-one-athlete-out CV for best Optuna trial ─────────────────
  stage4_loao:
    cmd: python -m experiments.gait_detection.pose_data.tcn_leave_one_out --config configs/experiments/pose_data/tcn_leave_one_out.yaml
    deps:
      - experiments/gait_detection/pose_data/tcn_leave_one_out.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - src/gait/gait_data/dataset.py
      - data/output/gait/pose_data/stage2/best_params.json
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/tcn_leave_one_out.yaml:
          - experiment.feature_idx
          - experiment.batch_size
          - experiment.max_epochs
          - experiment.early_stopping_patience
    outs:
      - data/output/gait/pose_data/stage4/

  # ── Stage 5 — final training on all train athletes ───────────────────────────
  stage5_train:
    cmd: python -m experiments.gait_detection.pose_data.tcn_training --config configs/experiments/pose_data/tcn_training.yaml
    deps:
      - experiments/gait_detection/pose_data/tcn_training.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - src/gait/gait_data/dataset.py
      - data/output/gait/pose_data/stage2/best_params.json
      - data/output/gait/pose_data/stage4/
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/tcn_training.yaml:
          - experiment.feature_idx
          - experiment.batch_size
          - log_every
    outs:
      - data/output/gait/pose_data/stage5/training.json
      - data/output/gait/pose_data/stage5/checkpoint.pt:
          cache: true

  # ── Stage 6 — inference: save per-record softmax probabilities ────────────────
  stage6_infer:
    cmd: python -m experiments.gait_detection.pose_data.tcn_inference --config configs/experiments/pose_data/tcn_inference.yaml
    deps:
      - experiments/gait_detection/pose_data/tcn_inference.py
      - src/gait/detection/model.py
      - src/gait/gait_data/dataset.py
      - data/output/gait/pose_data/stage5/
      - data/output/annotations/optojump/ml_training_dataset.csv
      - data/output/pose/tuned_yolo/
    params:
      - configs/experiments/pose_data/tcn_inference.yaml:
          - experiment.feature_idx
    outs:
      - data/output/gait/pose_data/stage6/manifest.json
      - data/output/gait/pose_data/stage6/probs/

  # ════════════════════════════════════════════════════════════════════════════
  # IMAGE PIPELINE  (CNN backbone + TCN, parallel to pose pipeline)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Stage I — extract per-frame CNN features from video crops ────────────────
  img_feature_extract:
    cmd: python -m experiments.gait_detection.image.feature_extract --config configs/experiments/image/feature_extract.yaml
    deps:
      - experiments/gait_detection/image/feature_extract.py
      - src/gait/image/extractor.py
      - configs/experiments/image/feature_extract.yaml
      - data/input/optojump/
      - data/output/pose/tuned_yolo/000332/optojump
    params:
      - configs/experiments/image/feature_extract.yaml:
          - backbone
          - img_size
          - bbox_padding
    outs:
      - data/output/gait/image_features/

  # ── Stage II — per-frame XGBoost baseline with Optuna tuning ────────────────
  img_baselines:
    cmd: python -m experiments.gait_detection.image.baselines --config configs/experiments/image/baselines.yaml
    deps:
      - experiments/gait_detection/image/baselines.py
      - src/gait/image/dataset.py
      - src/gait/detection/metrics.py
      - configs/experiments/image/baselines.yaml
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/baselines.yaml:
          - optuna.n_trials
          - experiment.n_val_athletes_tuning
    outs:
      - data/output/gait/image/stage1/results.json
      - data/output/gait/image/stage1/checkpoints/xgboost_best.pkl

  # ── Stage III — TCN hyperparameter search (Optuna + MLflow) ─────────────────
  img_tcn_tune:
    cmd: python -m experiments.gait_detection.image.tcn_tune --config configs/experiments/image/tcn_tuning.yaml
    deps:
      - experiments/gait_detection/image/tcn_tune.py
      - src/gait/image/dataset.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - configs/experiments/image/tcn_tuning.yaml
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/tcn_tuning.yaml:
          - optuna.n_trials
          - experiment.n_val_athletes_tuning
          - search_space
    outs:
      - data/output/gait/image/stage2/best_params.json
      - data/output/gait/image/stage2/study.log

  # ── Stage IV — LOAO cross-validation (MLflow per fold) ───────────────────────
  img_tcn_loao:
    cmd: python -m experiments.gait_detection.image.tcn_loao --config configs/experiments/image/tcn_leave_one_out.yaml
    deps:
      - experiments/gait_detection/image/tcn_loao.py
      - src/gait/image/dataset.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - data/output/gait/image/stage2/best_params.json
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/tcn_leave_one_out.yaml:
          - experiment.max_epochs
          - experiment.early_stopping_patience
          - experiment.batch_size
    outs:
      - data/output/gait/image/stage4/

  # ── Stage V — final training on all train athletes ────────────────────────────
  img_tcn_train:
    cmd: python -m experiments.gait_detection.image.tcn_train --config configs/experiments/image/tcn_training.yaml
    deps:
      - experiments/gait_detection/image/tcn_train.py
      - src/gait/image/dataset.py
      - src/gait/detection/model.py
      - src/gait/detection/train.py
      - data/output/gait/image/stage2/best_params.json
      - data/output/gait/image/stage4/
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/tcn_training.yaml:
          - experiment.batch_size
          - log_every
    outs:
      - data/output/gait/image/stage5/

  # ── Stage VI — inference: save per-record softmax probabilities ──────────────
  img_tcn_infer:
    cmd: python -m experiments.gait_detection.image.tcn_infer --config configs/experiments/image/tcn_inference.yaml
    deps:
      - experiments/gait_detection/image/tcn_infer.py
      - src/gait/image/dataset.py
      - src/gait/detection/model.py
      - data/output/gait/image/stage5/
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/tcn_inference.yaml:
          - experiment.n_classes
    outs:
      - data/output/gait/image/stage6/manifest.json
      - data/output/gait/image/stage6/probs/

  # ── ResNet linear-head finetune (image) ──────────────────────────────────────
  img_resnet_tune:
    cmd: python -m experiments.gait_detection.image.resnet_tune --config configs/experiments/image/resnet_tune.yaml
    deps:
      - experiments/gait_detection/image/resnet_tune.py
      - src/gait/image/finetune.py
      - src/gait/image/dataset.py
      - data/output/gait/image_features/
      - data/output/annotations/optojump/ml_training_dataset.csv
    params:
      - configs/experiments/image/resnet_tune.yaml:
          - optuna.n_trials
          - experiment.random_seed
          - search_space
    outs:
      - data/output/gait/image/resnet/tune/best_params.json

  img_resnet_train:
    cmd: python -m experiments.gait_detection.image.resnet_train --config configs/experiments/image/resnet_train.yaml
    deps:
      - experiments/gait_detection/image/resnet_train.py
      - src/gait/image/finetune.py
      - src/gait/image/dataset.py
      - data/output/gait/image_features/
      - data/output/gait/image/resnet/tune/best_params.json
      - data/output/annotations/optojump/ml_training_dataset.csv
    outs:
      - data/output/gait/image/resnet/train/checkpoint.pt:
          cache: true
      - data/output/gait/image/resnet/train/resnet_training.json

  img_resnet_infer:
    cmd: python -m experiments.gait_detection.image.resnet_infer --config configs/experiments/image/resnet_infer.yaml
    deps:
      - experiments/gait_detection/image/resnet_infer.py
      - src/gait/image/finetune.py
      - src/gait/image/dataset.py
      - data/output/gait/image_features/
      - data/output/gait/image/resnet/train/checkpoint.pt
      - data/output/gait/image/resnet/tune/best_params.json
      - data/output/annotations/optojump/ml_training_dataset.csv
    outs:
      - data/output/gait/image/resnet/infer/manifest.json
      - data/output/gait/image/resnet/infer/probs/

  # ── Notebooks — executed with papermill, outputs written to data/ ─────────────

  nb_eda:
    cmd: >
      papermill notebooks/eda_training_dataset.ipynb
      data/output/gait/notebooks/eda_training_dataset.ipynb
      -k python3
    deps:
      - notebooks/eda_training_dataset.ipynb
      - data/output/annotations/optojump/ml_training_dataset.csv
    outs:
      - data/output/gait/notebooks/eda_training_dataset.ipynb:
          cache: false

  nb_optuna_analysis:
    cmd: >
      papermill notebooks/analyze_optuna_study.ipynb
      data/output/gait/notebooks/analyze_optuna_study.ipynb
      -k python3
    deps:
      - notebooks/analyze_optuna_study.ipynb
      - data/output/gait/pose_data/stage2/study.log
      - data/output/gait/pose_data/stage2/best_params.json
      - data/output/gait/pose_data/stage4/
      - data/output/gait/image/stage2/study.log
      - data/output/gait/image/stage2/best_params.json
      - data/output/gait/image/stage4/
    outs:
      - data/output/gait/notebooks/analyze_optuna_study.ipynb:
          cache: false

  nb_model_comparison:
    cmd: >
      papermill notebooks/compare_kinematic_xgboost.ipynb
      data/output/gait/notebooks/compare_kinematic_xgboost.ipynb
      -k python3
    deps:
      - notebooks/compare_kinematic_xgboost.ipynb
      - src/gait/detection/postprocess.py
      - src/gait/detection/metrics.py
      - data/output/gait/pose_data/stage3/best_params.json
      - data/output/gait/pose_data/stage6/manifest.json
      - data/output/gait/pose_data/stage6/probs/
      - data/output/gait/image/stage6/manifest.json
      - data/output/gait/image/stage6/probs/
    outs:
      - data/output/gait/notebooks/compare_kinematic_xgboost.ipynb:
          cache: false

  nb_postprocessing:
    cmd: >
      papermill notebooks/compare_postprocessing.ipynb
      data/output/gait/notebooks/compare_postprocessing.ipynb
      -k python3
    deps:
      - notebooks/compare_postprocessing.ipynb
      - src/gait/detection/postprocess.py
      - src/gait/detection/metrics.py
      - data/output/gait/pose_data/stage6/manifest.json
      - data/output/gait/pose_data/stage6/probs/
      - data/output/gait/image/stage6/manifest.json
      - data/output/gait/image/stage6/probs/
    outs:
      - data/output/gait/notebooks/compare_postprocessing.ipynb:
          cache: false
