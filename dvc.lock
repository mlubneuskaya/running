      hash: md5
      md5: d146fba8c493f6d56ec59da687653d9a
      size: 1425
    params:
      configs/pose/ray_tune.yaml:
        space:
          freeze:
            type: choice
            values:
            - 11
            - 23
          lr0:
            type: uniform
            min: 1e-05
            max: 0.1
          lrf:
            type: uniform
            min: 0.01
            max: 1.0
          momentum:
            type: uniform
            min: 0.6
            max: 0.98
          pose:
            type: uniform
            min: 10
            max: 25
          weight_decay:
            type: uniform
            min: 0.0
            max: 0.001
        tune_args.iterations: 60
  yolo_finetune:
    cmd: python scripts/yolo_finetuning/finetune_yolo.py --config 
      configs/pose/yolo_full_training.yaml
