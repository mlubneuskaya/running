      configs/pose/yolo_full_training.yaml:
        ray_tune.metric: metrics/mAP50-95(P)
        ray_tune.top_n: 4
        training.epochs: 500
        training.patience: 100
    outs:
    - path: data/models/yolo/tuned/yolo26l_full_d725f_000332/
